[project]
name = "rag-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "document-ingestion",
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "lxml>=6.1.3",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[project.scripts]
rag-engineering = "rag_engineering:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "projects/00_document_ingestion",
]

[tool.uv.sources]
document-ingestion = { workspace = true, editable = true }
