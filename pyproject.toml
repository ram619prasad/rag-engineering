[project]
name = "rag-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "docling>=2.140.0",
    "document-ingestion",
    "docx2txt>=0.9",
    "fastapi>=0.151.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-engineering = "rag_engineering:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "projects/00_document_ingestion",
]

[tool.uv.sources]
document-ingestion = { workspace = true, editable = true }
